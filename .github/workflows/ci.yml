name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install black ruff sqlfluff

      - name: Check Python formatting (black)
        run: black --check ingestion/ ml/ rag/ dags/ --diff
        continue-on-error: true

      - name: Lint Python (ruff)
        run: ruff check ingestion/ ml/ rag/ dags/
        continue-on-error: true

      - name: Lint SQL (sqlfluff)
        run: sqlfluff lint dbt_project/models/ --dialect duckdb
        continue-on-error: true

  dbt-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dbt-core==1.11.12 dbt-duckdb==1.9.1 duckdb==1.5.4 pandas==2.2.2

      - name: Run dbt models against committed DuckDB file
        working-directory: dbt_project
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          india_development_study:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ../data/raw/india_dev.duckdb
                threads: 4
          PROFILE
          dbt run
          dbt test
